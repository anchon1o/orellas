<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Web Audio API Test</title></head>
<body>
  <h1>Prueba de Web Audio API</h1>
  <button onclick="playTone()">Tocar tono puro</button>

  <script>
    function playTone() {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = "sine";
      osc.frequency.value = 440;
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + 1);
    }
  </script>
</body>
</html>
