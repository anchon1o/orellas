<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio Dodecafónico</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="main.js"></script>
</head>
<body>
  <h1>Serie Dodecafónica</h1>

  <label for="nivel">Nivel: <span id="nivel-valor">12</span></label>
  <input type="range" id="nivel" min="1" max="12" value="12" />

  <br><br>

  <button id="start">Reproducir serie</button>
  <button id="pause">Pausar</button>

  <div id="respuesta"></div>

  <!-- Teclas negras (alteradas) -->
  <div id="teclas-alteradas" class="fila-teclas"></div>

  <!-- Teclas blancas (naturales) -->
  <div id="teclas-naturales" class="fila-teclas"></div>

  <p id="resultado"></p>

  <script>
    const slider = document.getElementById("nivel");
    const output = document.getElementById("nivel-valor");
    slider.oninput = () => {
      output.textContent = slider.value;
    };
  </script>
</body>
</html>
