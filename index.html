<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio Dodecafónico</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="main.js"></script>
</head>
<body>
  <h1>Serie Dodecafónica</h1>

  <div class="controles">
    <label for="nivel">Nivel: <span id="nivel-valor">12</span></label>
    <input type="range" id="nivel" min="1" max="12" value="12" />

    <label for="velocidad">Velocidad: <span id="velocidad-valor">3</span></label>
    <input type="range" id="velocidad" min="1" max="5" value="3" />
  </div>

  <br>

  <button id="start">Reproducir serie</button>
  <button id="pause">Pausar</button>

  <!-- Teclas alteradas -->
  <div id="teclas-alteradas" class="fila-teclas"></div>

  <!-- Teclas naturales -->
  <div id="teclas-naturales" class="fila-teclas"></div>

  <!-- Respuesta y resultado -->
  <div id="respuesta"></div>
  <p id="resultado"></p>

  <script>
    document.getElementById("nivel").oninput = (e) =>
      document.getElementById("nivel-valor").textContent = e.target.value;

    document.getElementById("velocidad").oninput = (e) =>
      document.getElementById("velocidad-valor").textContent = e.target.value;
  </script>
</body>
</html>
