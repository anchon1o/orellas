<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Adestramento Auditivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Fuente Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script defer src="main.js"></script>
  <!-- VexFlow desde CDN -->
<script src="https://unpkg.com/vexflow/releases/vexflow-min.js"></script>
</head>
<body>

  <h1>Serie Dodecafónica</h1>


<div class="modo-timbre">
  <label for="modo"></label>
  <select id="modo">
    <option value="directo" selected>XOGO RÁPIDO</option>
    <option value="memoria">MEMORIA</option>
  </select>

  <label for="forma-onda"></label>
  <select id="forma-onda">
    <option value="sine">Son puro</option>
    <option value="square">Cadrada</option>
    <option value="sawtooth">Dente serra</option>
    <option value="triangle">Triangular</option>
  </select>
</div>


  <div class="controles">
    <div class="control-slider">
      <label for="nivel">NIVEL</label>
      <input type="range" id="nivel" min="1" max="12" value="6">
      <span id="nivel-valor">6</span>
    </div>

    <div class="control-slider">
      <label for="velocidad">VELOCIDADE</label>
      <input type="range" id="velocidad" min="1" max="5" value="3">
      <span id="velocidad-valor">3</span>
    </div>
  </div>

  <div class="grupo-switches">
  <label class="switch">
    <input type="checkbox" id="solo-naturales">
    <span class="slider"></span>
    <span class="switch-label">Solo nat.</span>
  </label>

  <label class="switch">
    <input type="checkbox" id="octava-superior">
    <span class="slider"></span>
    <span class="switch-label">8ª sup</span>
  </label>

  <label class="switch">
    <input type="checkbox" id="octava-inferior">
    <span class="slider"></span>
    <span class="switch-label">8ª inf</span>
  </label>
</div>


 <div class="botones-control">
  <button id="start">Nova serie</button>
  <button id="repeat">Repetir</button>
  <button id="pause">Pausar</button>
</div>

  <div id="teclas-alteradas" class="fila-teclas"></div>
  <div id="teclas-naturales" class="fila-teclas"></div>

  <div id="respuesta"></div>
  <p id="resultado"></p>
  <div id="partitura"></div>

  <!-- PUNTUACIÓN AL FINAL -->
  <div id="puntuacion">
    Puntuación: <span id="valor-puntuacion">0</span>
  </div>

  <script>
    document.getElementById("nivel").oninput = e =>
      document.getElementById("nivel-valor").textContent = e.target.value;

    document.getElementById("velocidad").oninput = e =>
      document.getElementById("velocidad-valor").textContent = e.target.value;
  </script>

</body>
</html>
